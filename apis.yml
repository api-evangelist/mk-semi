name: Mauna Kea Semiconductors
description: >-
  Mauna Kea Semiconductors (mk-semi.com) is a Silicon Valley-based fabless
  semiconductor company founded by industry veterans to develop what it
  describes as the world's lowest-power Ultra-Wideband (UWB) solution for high
  precision location and direction-finding applications. Its UWB chips, modules,
  and integrated System-on-Chip solutions target smartphones, wearables, IoT
  devices, and automotive use cases, combining digital and analog/mixed-signal
  design expertise. Headquartered in Cupertino, California, with engineering
  operations in Shanghai, Beijing, and Shenzhen, the company is led by CEO
  Dr. Yifeng Zhang and is backed by Qiming. It was added to the API Evangelist
  network as a portfolio company of Qiming; it is a hardware/silicon vendor with
  no public API or developer surface at this time (documentation, blog, and
  careers pages are marked "Coming Soon").
